[project]
name = "mcp-gatekeeper"
version = "0.1.0"
description = "Deterministic, model-free MCP safety proxy for PostgreSQL: AST policy, optimistic concurrency, circuit breakers, savepoint rollback, replay traces."
readme = "README.md"
authors = [{ name = "Vaibhav Lalwani" }]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "sqlglot>=30.33.0",
    "typer>=0.29.2",
]

license = "MIT"

[project.scripts]
mcp-gatekeeper = "mcp_gatekeeper.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "BLE", "S"]
ignore = ["E501", "S101", "S608", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
"benchmarks/*" = ["S", "BLE001", "ASYNC"]
"examples/*" = ["S"]
"tools/*" = ["S", "E402", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_gatekeeper"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["src", "tests", "benchmarks"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sqlglot.*"]
follow_imports = "normal"
